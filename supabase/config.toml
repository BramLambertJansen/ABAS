project_id = "abas"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
# `true` here only because of a known GoTrue quirk (supabase/auth#330,
# still open as of 2026-08-26): `enable_signup = false` doesn't just block
# *new* signups, it disables the entire email provider, including
# signInWithPassword for already-existing users — which is exactly what
# supabase/seed.sql's device-account insert and (once #15 ships)
# shells/portal's password login both need. This file governs the local
# `supabase start` stack only (`project_id` above is a local Docker Compose
# name, not a linked remote project — nothing here runs `supabase config
# push`), so it has no bearing on the real hosted project's signup policy.
# **Flag for #15 (portal-login)**: if the hosted project's own dashboard
# setting ever mirrors `false` here, password login will silently break
# for existing members too, not just signups — worth confirming against
# a real project before relying on password login in production.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Beheer eist een tweede factor (TOTP, aal2): docs/features/
# beheer-tweede-factor.md → Config, ADR 0017. Op het gehoste project staat
# dit in het dashboard (Auth → MFA), zie de uitrolstap in die spec.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
