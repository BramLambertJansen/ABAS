name: Production release

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: abas-production-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/check-release-ci.mjs
      - name: Require Vercel configuration
        run: test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
      - run: npm ci
      - run: npm install --global vercel@59.16.0
      - run: vercel pull --yes --environment=production
      - run: vercel build --prod
      - run: node scripts/check-release-ci.mjs
      - run: vercel deploy --prebuilt --prod
