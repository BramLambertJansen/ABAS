name: CodeQL

# Klaargezet, niet actief (ADR 0025). De repo is privé zonder GitHub Code
# Security; CodeQL op private code vraagt die licentie. Zet Bram Code
# Security aan of wordt de repo publiek: voeg dan `pull_request:` en
# `push: branches: [main]` toe onder `on:`.
on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@88585263c0627ee42c0e1c5143a112c8d6f4aa18 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@88585263c0627ee42c0e1c5143a112c8d6f4aa18 # v4.38.2
