name: CodeQL

# Klaargezet, niet actief (ADR 0025). De repo is privé zonder GitHub Code
# Security; CodeQL op private code vraagt die licentie. Zet Bram Code
# Security aan of wordt de repo publiek: voeg dan `pull_request:` en
# `push: branches: [main]` toe onder `on:`.
on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
