name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Eén bron (ADR 0025): CI draait `check:all` = `check:fast` + `check:slow`
  # uit package.json, in twee stappen zodat de goedkope helft eerst faalt.
  # Wat elke gate bewaakt: `node scripts/kit/feiten.mjs gates`.
  check-all:
    runs-on: ubuntu-latest
    steps:
      # Volledige history: check:migrations vergelijkt met origin/main
      # (append-only).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # lint, typecheck, test, check:arch/policy/rls/migrations/adr/docs —
      # zonder database, gelijk aan de pre-commit hook.
      - run: npm run check:fast

      # Vaste versie, geen `latest`: `latest` vraagt bij elke run de GitHub
      # API welke release de nieuwste is, en een 500 of rate limit daarop
      # maakte CI rood zonder dat er een test faalde (PR #96, 2026-09-28).
      # >= 2.102.0 nodig voor `auto_expose_new_tables` in config.toml.
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.118.0

      # Volledige lokale stack (Docker op de runner), seedt supabase/seed.sql.
      # build en check:a11y hebben hem nodig: e2e start een echte dienst
      # tegen het demo-baraccount uit de seed.
      - run: supabase start

      # `supabase status -o json` geeft stabiele veldnamen; SUPABASE_SECRET_KEY
      # (service_role van de lokale stack) is nodig voor de server-side
      # bar-login (src/lib/barLogin.ts, ADR 0016).
      - name: Export local Supabase env vars
        run: |
          status=$(supabase status -o json)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$status" | jq -r '.API_URL')"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(echo "$status" | jq -r '.PUBLISHABLE_KEY')"
            echo "SUPABASE_SECRET_KEY=$(echo "$status" | jq -r '.SERVICE_ROLE_KEY')"
          } >> "$GITHUB_ENV"

      - run: npx playwright install --with-deps chromium

      # check:deployment, build, db:test, test:integration, check:a11y.
      - run: npm run check:slow

      - if: always()
        run: supabase stop
